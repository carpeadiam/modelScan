# PipelineGuard pipeline. Stages: 1 init | 2 git metadata | 3 model fetch | 4 prediction (advisory)
# | 5 install+config+build | 6 unit tests | 7 reporting.
# NOTE: _SCENARIO is passed ONLY to steps that execute it (never to prediction steps).
steps:
  - id: env-init                      # Stage 1
    name: python:3.11-slim
    entrypoint: bash
    args: ['ci/00_init.sh']
    env: ['SCENARIO=${_SCENARIO}', 'BUILD_ID=$BUILD_ID', 'PROJECT_ID=$PROJECT_ID']

  - id: git-metadata                  # Stage 2 (+ historical metrics supplied at submission time)
    name: python:3.11-slim
    entrypoint: python
    args: ['ci/01_git_metadata.py']
    env:
      - 'PG_COMMIT_SHA=${_COMMIT_SHA}'
      - 'PG_FILES_CHANGED=${_FILES_CHANGED}'
      - 'PG_LINES_ADDED=${_LINES_ADDED}'
      - 'PG_LINES_DELETED=${_LINES_DELETED}'
      - 'PG_PY_FILES_CHANGED=${_PY_FILES_CHANGED}'
      - 'PG_TEST_FILES_CHANGED=${_TEST_FILES_CHANGED}'
      - 'PG_DEPENDENCY_CHANGES=${_DEPENDENCY_CHANGES}'
      - 'PG_KNOWN_TEST_COUNT=${_KNOWN_TEST_COUNT}'
      - 'PG_PREV_FAILED=${_PREV_FAILED}'
      - 'PG_PREV3_FAILURES=${_PREV3_FAILURES}'
      - 'PG_HIST_AVG_DURATION=${_HIST_AVG_DURATION}'
      - 'PG_HIST_FAILURE_RATE=${_HIST_FAILURE_RATE}'

  - id: fetch-model                   # Stage 3
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args: ['ci/02_fetch_model.sh']
    env: ['MODEL_BUCKET=${_BUCKET}']

  - id: predict                       # Stage 4: advisory ML prediction
    name: python:3.11-slim
    entrypoint: bash
    args: ['ci/03_predict.sh']
    env: ['PG_ENABLE_PREDICTION=${_ENABLE_PREDICTION}']

  - id: upload-prediction
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args: ['ci/04_upload_prediction.sh']
    env: ['BUCKET=${_BUCKET}', 'BUILD_ID=$BUILD_ID']

  - id: risk-gate                     # warning only unless _BLOCKING_MODE=true (experimental)
    name: python:3.11-slim
    entrypoint: python
    args: ['ci/05_risk_gate.py']
    env: ['BLOCKING_MODE=${_BLOCKING_MODE}']

  - id: install-dependencies          # Stage 5
    name: python:3.11-slim
    entrypoint: bash
    args: ['ci/06_install.sh']
    env: ['SCENARIO=${_SCENARIO}']

  - id: config-check
    name: python:3.11-slim
    entrypoint: bash
    args: ['ci/07_config_check.sh']
    env: ['SCENARIO=${_SCENARIO}', 'APP_CONFIG=${_APP_CONFIG}']

  - id: build
    name: python:3.11-slim
    entrypoint: bash
    args: ['ci/08_build.sh']
    env: ['SCENARIO=${_SCENARIO}']

  - id: unit-tests                    # Stage 6
    name: python:3.11-slim
    entrypoint: bash
    args: ['ci/09_tests.sh']
    env: ['SCENARIO=${_SCENARIO}']

  - id: report                        # Stage 7 (runs only if everything above succeeded)
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args: ['ci/10_report.sh']
    env: ['BUCKET=${_BUCKET}', 'BUILD_ID=$BUILD_ID']

timeout: 1200s
tags: ['pipelineguard']
options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE
substitutions:
  _SCENARIO: success
  _EXPERIMENT_ID: manual
  _RUN_INDEX: '0'
  _COMMIT_SHA: ''
  _BUCKET: ''
  _APP_CONFIG: production
  _ENABLE_PREDICTION: 'true'
  _BLOCKING_MODE: 'false'
  _FILES_CHANGED: ''
  _LINES_ADDED: ''
  _LINES_DELETED: ''
  _PY_FILES_CHANGED: ''
  _TEST_FILES_CHANGED: ''
  _DEPENDENCY_CHANGES: ''
  _KNOWN_TEST_COUNT: ''
  _PREV_FAILED: ''
  _PREV3_FAILURES: ''
  _HIST_AVG_DURATION: ''
  _HIST_FAILURE_RATE: ''
